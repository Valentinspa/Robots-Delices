<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./navbar.css">
    <link rel="stylesheet" href="./auth-pages.css"> <!-- Changement: auth-pages.css au lieu de login.css -->
    <link rel="stylesheet" href="footer.css">
    <title>Connexion - Robots-Délices</title>
</head>
<body class="login-page">
    <header>
        <div id="section">
            <div id="header-title">
                <a href="./index.html">
                    <img id="logo" alt="Logo Robots-Délices" src="./img/logo_robots_delices.png">
                </a>
            </div>
            <input id="menu-toggle" type="checkbox" />
            <label class="burger-menu" for="menu-toggle">
                <span class="burger-line"></span>
                <span class="burger-line"></span>
                <span class="burger-line"></span>
            </label>
            <div id="nav-container" class="nav-container">
                <ul class="nav-menu">
                    <li class="li"><a href="./index.html">Accueil</a></li>
                    <li class="li"><a href="./index.html#recettes">Recettes</a></li>
                    <li class="li"><a href="./index.html#categories">Catégories</a></li>
                    <li class="li"><a href="./favoris.html">Mes favoris</a></li>
                    <li class="li"><a href="./ajouter.html" class="ajouter-btn">+ Ajouter une recette</a></li>
                    <li class="li"><a href="./login.html" class="connexion-btn">Connexion</a></li>
                </ul>
            </div>
            <div class="menu-overlay"></div>
        </div>
    </header>
    <main>
        <div id="section-container">
            <!-- Section gauche avec logo et texte -->
            <div id="login-container">
                <img alt="Logo Robots-Délices" id="logo" src="./img/logo_robots_delices.png"/>
                <p>Rejoignez notre communauté de passionnés de cuisine et partagez vos meilleures recettes</p>
            </div>
            
            <!-- Section droite avec formulaire de connexion -->
            <div class="right-section">
                <div class="tabs-container">
                    <a href="./login.html" class="active">Connexion</a>
                    <a href="./register.html">Inscription</a>
                </div>
                <div id="form-container">
                    <form id="login-form" action="/login" method="POST">
                        <div>
                            <label for="email">Email :</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="password">Mot de passe :</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit">Se connecter</button>
                    </form>
                    <a href="./mdp-oublié.html">Mot de passe oublié ?</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2025 Robots-Délices. Tous droits réservés.</p>
    </footer>
</body>
</html>
